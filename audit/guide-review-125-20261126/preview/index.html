<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src https://cdn-ak.f.st-hatena.com; base-uri 'none'; form-action 'none'; connect-src 'none'">
  <title>きのこ図鑑の名称確認</title>
  <link rel="stylesheet" href="review.css">
  <script defer src="data.js"></script>
  <script defer src="review.js"></script>
</head>
<body>
  <header class="masthead">
    <div class="shell masthead-inner">
      <div>
        <p class="eyebrow">きのこ図鑑 <span>管理室の画面試作</span></p>
        <h1>名称と写真の確認</h1>
        <p>写真と元記事を見比べ、撮影時の名称を確認します。メモと選択はこのブラウザに保存されます。</p>
      </div>
      <button type="button" class="secondary" id="export">確認メモを保存（JSON）</button>
    </div>
  </header>
  <main class="shell">
    <section class="overview" aria-label="確認の進捗">
      <div class="progress-summary">
        <strong id="progress-label">0 / 125</strong>
        <label for="progress">名称確認済み</label>
        <progress id="progress" max="125" value="0"></progress>
      </div>
      <p id="totals" aria-live="polite"></p>
      <p id="save-status" role="status">ローカル保存</p>
    </section>
    <div class="workspace">
      <aside class="queue" aria-labelledby="queue-title">
        <h2 id="queue-title">確認対象</h2>
        <label class="filter-label" for="search">掲載名で検索</label>
        <input id="search" type="search" placeholder="例　ニガイグチモドキ">
        <div class="filters">
          <div>
            <label class="filter-label" for="order">並べ替え</label>
            <select id="order"><option value="priority">優先順</option><option value="photos">写真が多い順</option></select>
          </div>
          <div>
            <label class="filter-label" for="state">確認状況</label>
            <select id="state">
              <option value="all">すべて</option><option value="unreviewed">未確認</option>
              <option value="confirmed">名称確認済み</option><option value="individual">個別確認</option>
              <option value="held">保留</option><option value="stale">再確認</option>
            </select>
          </div>
        </div>
        <p class="filter-label" id="results" aria-live="polite"></p>
        <ul id="queue"></ul>
      </aside>
      <section class="detail" id="detail" tabindex="-1" aria-label="選択した掲載項目"></section>
    </div>
  </main>
  <noscript>確認画面を使うには JavaScript を有効にしてください。</noscript>
</body>
</html>
