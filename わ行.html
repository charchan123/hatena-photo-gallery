<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>わ行のキノコ｜キノコ図鑑</title>
<link rel="stylesheet" href="assets/gallery.css">
<link rel="stylesheet" href="assets/aiuo.css">

<link rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/css/lightgallery-bundle.min.css">

<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/lightgallery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/plugins/zoom/lg-zoom.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/plugins/thumbnail/lg-thumbnail.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/plugins/autoplay/lg-autoplay.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lightgallery@2.8.3/plugins/share/lg-share.min.js"></script>

</head>
<body class="aiuo-index">
<main id="gallery-content-root" class="aiuo-page">
  <section class="aiuo-hub" aria-labelledby="aiuo-title">
    <header class="aiuo-hero">
      <a class="aiuo-back-link" href="index.html">← 図鑑へ戻る</a>
      <div class="aiuo-hero-copy">
        <span class="aiuo-eyebrow">GOJUON INDEX</span>
        <h1 id="aiuo-title">わ行のキノコ</h1>
        <p>名前の最初の文字から、このブログで出会ったキノコを探せます。</p>
      </div>
    </header>

    <div class="aiuo-hub-body">
      <div class="aiuo-heading">
        <span class="aiuo-eyebrow">FILTER BY INITIAL</span>
        <h2>頭文字から絞り込む</h2>
        <p>わ行に登録されているキノコを、頭文字または名前から絞り込めます。</p>
      </div>
      <div class="aiuo-filter-panel">
        <div class="aiuo-filter">
          <div class="kana-grid">
            <button type="button" class="kana-btn active" data-kana="all">すべて</button>
            <button type="button" class="kana-btn" data-kana="ワ">ワ</button>
          </div>
        </div>
        <div class="search-wrap search-wrap--page">
          <input type="text" class="search-input" aria-label="キノコ名で絞り込み"
                 placeholder="キノコ名で絞り込み">
        </div>
      </div>
    </div>
  </section>

  <section class="aiuo-results-panel" aria-labelledby="aiuo-results-title">
    <header class="aiuo-results-heading">
      <div>
        <span class="aiuo-eyebrow">MUSHROOMS</span>
        <h2 id="aiuo-results-title">わ行のキノコ一覧</h2></div><span>2種類</span></header><div class='mushroom-list'>
        <a href="ワセヌメリササタケ.html?from=aiuo&kana=わ行"
           class="mushroom-card"
           data-name="ワセヌメリササタケ"
           data-kana="ワ">
          <div class="mushroom-card-thumb">
            <span class="card-fav">☆</span>
            <img src='https://cdn-ak.f.st-hatena.com/images/fotolife/e/exsudoporus_ruber/20260926/20260926222318.jpg?width=400' alt='ワセヌメリササタケ' loading='lazy'>
          </div>
          <div class="mushroom-card-name">ワセヌメリササタケ</div>
        </a>

        <a href="ワタカラカサタケ.html?from=aiuo&kana=わ行"
           class="mushroom-card"
           data-name="ワタカラカサタケ"
           data-kana="ワ">
          <div class="mushroom-card-thumb">
            <span class="card-fav">☆</span>
            <img src='https://cdn-ak.f.st-hatena.com/images/fotolife/e/exsudoporus_ruber/20251005/20251005201456.jpg?width=400' alt='ワタカラカサタケ' loading='lazy'>
          </div>
          <div class="mushroom-card-name">ワタカラカサタケ</div>
        </a>
      </div>
  </section>

  <footer class="aiuo-footer">
    <a href="index.html">← キノコ図鑑へ戻る</a>
  </footer>
</main>
<script src="https://unpkg.com/imagesloaded@5/imagesloaded.pkgd.min.js"></script>
<script src="assets/mosaic-layout.js"></script>
<script src="assets/gallery.js"></script>
</body>
</html>
