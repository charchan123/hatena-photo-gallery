name: Phase 4C.5 Detail Favorite Tests

on:
  push:
    branches:
      - phase4c5-detail-favorite-pc
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Python compile
        run: |
          python -m py_compile main.py portal_data.py season_ui.py records_ui.py detail_ui.py feature_ui.py research_ui.py best_shot_ui.py mushroom_knowledge.py

      - name: Pytest
        run: python -m pytest -q

      - name: Pytest collect
        run: python -m pytest --collect-only -q

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript checks
        run: |
          node --check assets/gallery.js
          node tests/test_gallery_highlight.js
          node tests/test_gallery_height.js
          node tests/test_features_filter.js

      - name: Diff check
        run: git diff --check 6b649d7172c8098b2e31276e547a77322bd5d6b9..HEAD
