name: Build & Deploy Photo Gallery

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    # 00:00 UTC = 09:00 JST. GitHub may delay scheduled runs.
    - cron: '0 0 * * *'

permissions:
  contents: write # Existing Pages deploy plus hash-only audit branch; no source writes.
  pull-requests: read

# Compare against the last publication, never two concurrent stale baselines.
concurrency:
  group: hatena-gallery-publication
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 リポジトリ取得
        uses: actions/checkout@v4

      - name: Restore previous successful publication (read-only)
        continue-on-error: true # Wrapper records UNKNOWN and fails closed if unavailable.
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .sync-previous
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /portal-data.json
            /phase3c-production-status.json
            /article-sync-snapshot.json
          persist-credentials: false

      - name: 🐍 Python セットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 依存パッケージをインストール（requirements.txt）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔑 はてなAPIキー設定
        env:
          HATENA_USER: ${{ secrets.HATENA_USER }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: |
          echo "環境変数チェック中..."
          if [ -z "$HATENA_USER" ]; then echo 'HATENA_USER missing'; exit 1; fi
          if [ -z "$HATENA_BLOG_ID" ]; then echo 'HATENA_BLOG_ID missing'; exit 1; fi
          if [ -z "$HATENA_API_KEY" ]; then echo 'HATENA_API_KEY missing'; exit 1; fi

      - name: 📥 EXIFキャッシュを復元
        id: exif-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: cache/exif-cache.json
          key: exif-cache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            exif-cache-v1-${{ runner.os }}-

      - name: 🏗 main.py 実行（HTML生成）
        if: always() # Record failed fetches even after a credential precheck failure.
        env:
          GH_TOKEN: ${{ github.token }}
          HATENA_USER: ${{ secrets.HATENA_USER }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: |
          python article_sync.py --previous .sync-previous --safe-deletions

      - name: Save sanitized read-only sync report (including failures)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: article-sync-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: cache/article-sync-report.json
          if-no-files-found: ignore
          retention-days: 30

      - name: 📤 EXIFキャッシュを保存
        uses: actions/cache/save@v4
        with:
          path: cache/exif-cache.json
          key: ${{ steps.exif-cache-restore.outputs.cache-primary-key }}

      - name: 📁 LightGallery フォルダを output にコピー
        run: |
          mkdir -p output/lightgallery
          cp -r lightgallery/* output/lightgallery/

      - name: 📤 GitHub Pages にデプロイ
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output
          branch: gh-pages
          clean: true
