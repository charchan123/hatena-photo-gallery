name: Build & Deploy Photo Gallery

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 リポジトリ取得
        uses: actions/checkout@v4

      - name: 🐍 Python セットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 依存パッケージをインストール（requirements.txt）
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🔑 はてなAPIキー設定
        env:
          HATENA_USER: ${{ secrets.HATENA_USER }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: |
          echo "環境変数チェック中..."
          if [ -z "$HATENA_USER" ]; then echo 'HATENA_USER missing'; exit 1; fi
          if [ -z "$HATENA_BLOG_ID" ]; then echo 'HATENA_BLOG_ID missing'; exit 1; fi
          if [ -z "$HATENA_API_KEY" ]; then echo 'HATENA_API_KEY missing'; exit 1; fi

      - name: 📥 EXIFキャッシュを復元
        id: exif-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: cache/exif-cache.json
          key: exif-cache-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            exif-cache-v1-${{ runner.os }}-

      - name: 🏗 main.py 実行（HTML生成）
        env:
          HATENA_USER: ${{ secrets.HATENA_USER }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
        run: |
          python main.py

      - name: 📤 EXIFキャッシュを保存
        uses: actions/cache/save@v4
        with:
          path: cache/exif-cache.json
          key: ${{ steps.exif-cache-restore.outputs.cache-primary-key }}

      - name: 📁 LightGallery フォルダを output にコピー
        run: |
          mkdir -p output/lightgallery
          cp -r lightgallery/* output/lightgallery/

      - name: 📤 GitHub Pages にデプロイ
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: output
          branch: gh-pages
          clean: true
