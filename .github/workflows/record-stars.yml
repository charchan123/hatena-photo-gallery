name: Read-only Hatena Star preview
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  stars:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated Chromium
        run: |
          npm install --prefix /tmp/record-star-browser --no-save playwright@1.62.1
          /tmp/record-star-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Read-only official widget feasibility (never click live add buttons)
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/record-star-browser/node_modules/playwright
        run: node tests/browser/record_stars.cjs /tmp/record-stars
      - name: Save isolated Star evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: record-stars-${{ github.run_id }}
          path: /tmp/record-stars/
          retention-days: 30
