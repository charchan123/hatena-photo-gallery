name: Read-only guide review admin
on:
  pull_request:
    branches: [main]
    paths:
      - 'admin/**'
      - 'tests/test_guide_review.py'
      - 'tests/browser/guide_review_admin.py'
      - 'tools/*guide_review*.py'
      - 'docs/guide-review-*.md'
      - '.github/workflows/guide-review-admin.yml'
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install -r requirements-dev.txt playwright==1.62.0
          python -m playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Validate local save and restore, photo coverage, and legacy scope
        run: python -m pytest -q tests/test_guide_review.py
      - name: Exercise every item at desktop and phone widths
        run: |
          git show 4d12205a98e640448b17883e4e89f1ab64a9fd50:portal-data.json > "${{ runner.temp }}/guide-portal.json"
          python tests/browser/guide_review_admin.py "${{ runner.temp }}/guide-portal.json" "${{ runner.temp }}/guide-review" --real-screenshots
      - name: Build Windows trial package
        if: always()
        run: python tools/build_guide_review_trial.py "${{ runner.temp }}/guide-review/Kinoko-Guide-Review-Windows.zip"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: guide-review-admin-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/guide-review/
          retention-days: 30
