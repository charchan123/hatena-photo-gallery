name: Read-only shared LightGallery regressions
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/gallery.js'
      - 'assets/record-stars.*'
      - 'best_shot_ui.py'
      - 'gallery_dependencies.py'
      - 'tests/browser/shared_lightgallery*'
      - '.github/workflows/shared-lightgallery.yml'
permissions:
  contents: read
jobs:
  shared-gallery:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated test dependencies
        run: |
          pip install -r requirements-dev.txt
          npm install --prefix /tmp/shared-gallery-browser --no-save playwright@1.58.0
          /tmp/shared-gallery-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Generator and authenticated parent regressions
        run: |
          python -m pytest -q tests/test_best_shot_ui.py tests/test_hatena_release_package.py
          node --test tests/test_hatena_release_home.js tests/test_hatena_iframe_handler.js tests/test_gallery_navigation.js tests/test_gallery_height.js
      - name: Prepare published baseline and candidate without running sync
        run: |
          git fetch origin gh-pages
          python tests/browser/shared_lightgallery_fixture.py /tmp/shared-gallery
      - name: PC and mobile shared gallery and native star layout
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/shared-gallery-browser/node_modules/playwright
        run: node tests/browser/shared_lightgallery.cjs /tmp/shared-gallery
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-gallery-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/shared-gallery/result.json
            /tmp/shared-gallery/failure.json
            /tmp/shared-gallery/manifest.json
            /tmp/shared-gallery/screenshots/
          retention-days: 30
