name: Phase 4C.9 Knowledge Promotion Tests

on:
  push:
    branches:
      - phase4c9-141-knowledge-expansion
      - phase4c9-v2-validator-implementation
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Python compile
        run: python -m compileall -q .

      - name: Pytest
        run: python -m pytest -q

      - name: Pytest collect
        run: python -m pytest --collect-only -q

      - name: Focused Phase 4C.9 v2 checks
        run: |
          python -m pytest -q tests/test_feature_v2.py
          python - <<'PY'
          import json
          from pathlib import Path
          from feature_ui import load_feature_v2_inputs, validate_feature_facets

          root = Path(".")
          with (root / "audit/phase4c9/v2/feature-facets-runtime-candidate-2026-10-03.json").open(encoding="utf-8") as stream:
              candidate = json.load(stream)
          inputs = load_feature_v2_inputs()
          master = inputs.pop("mushroom_master")
          assert validate_feature_facets(candidate, master, mode="production", **inputs) is True
          print("READY_FOR_PRODUCTION_CUTOVER")
          PY
          git grep -n -E 'validate_feature_facets|generate_feature_page|build_feature_search_model|render_feature_page' -- '*.py'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: JavaScript checks
        run: |
          node --check assets/gallery.js
          node --check assets/mosaic-layout.js
          node tests/test_gallery_highlight.js
          node tests/test_gallery_height.js
          node tests/test_features_filter.js
          node tests/test_mosaic_layout.js

      - name: Diff check
        run: git diff --check a1ba1c6d247291615378609dd82f0a3c1f0343e0..HEAD
