name: Read-only deletion audit
on:
  pull_request:
    branches: [main]
  schedule:
    # Independent read-only monitoring continues even if deploy/history storage fails.
    - cron: '30 1 * * *'
permissions:
  contents: read
  pull-requests: read
jobs:
  audit:
    if: github.event_name == 'schedule' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: .deletion-previous
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /portal-data.json
            /phase3c-production-status.json
            /article-sync-snapshot.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Restore EXIF cache for isolated preview (read-only)
        uses: actions/cache/restore@v4
        with:
          path: cache/exif-cache.json
          key: deletion-audit-exif-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            exif-cache-v1-${{ runner.os }}-
      - name: Capture independent complete API inventory (no generation or publication)
        env:
          HATENA_USER: ${{ secrets.HATENA_USER }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python deletion_review.py --previous .deletion-previous --baseline-commit "$(git -C .deletion-previous rev-parse HEAD)"
      - name: Validate real guarded generation without output or audit writes
        env:
          HATENA_USER: ${{ secrets.HATENA_USER }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json, subprocess
          from pathlib import Path
          result = subprocess.run(['python','article_sync.py','--previous','.deletion-previous',
              '--output','cache/never-published-deletion-preview','--report','cache/deletion-preview.json',
              '--safe-deletions','--deletion-preview'])
          report = json.loads(Path('cache/deletion-preview.json').read_text())
          if result.returncode == 0:
              assert report['result'] == 'PREVIEW'
          else:
              assert result.returncode == 1
              assert report['error_code'] == 'DELETION_CONFIRMATION_OR_APPROVAL_PENDING'
          assert report['deletions']['history_persisted'] is False
          assert not Path('cache/never-published-deletion-preview').exists()
          print('PASS: real guard evaluated latest inventory; no output/ref writes')
          PY
      - name: Save published-only evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deletion-live-audit-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            cache/deletion-live-audit.json
            cache/deletion-preview.json
          retention-days: 30
      - name: Summarize pending review and notify through scheduled Actions failures
        if: always()
        env:
          DELETION_MONITOR_EVENT: ${{ github.event_name }}
        run: python deletion_monitor.py
