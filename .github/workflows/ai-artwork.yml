name: Read-only AI artwork replacement
on:
  pull_request:
    branches: [main]
    paths:
      - 'assets/ai-*.webp'
      - 'assets/*.css'
      - 'main.py'
      - 'tests/browser/ai_artwork*'
      - 'tests/test_ai_artwork.py'
      - 'audit/ai-image-refresh-20261031/**'
      - '.github/workflows/ai-artwork.yml'
permissions:
  contents: read
jobs:
  artwork:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser and CJK fonts
        run: |
          pip install -r requirements-dev.txt
          npm install --prefix /tmp/ai-artwork-browser --no-save playwright@1.58.0
          /tmp/ai-artwork-browser/node_modules/.bin/playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk
      - name: Artwork bytes and authenticated parent regression tests
        run: |
          python -m pytest -q tests/test_ai_artwork.py tests/test_top_portal.py tests/test_hatena_release_package.py
          node --test tests/test_hatena_release_home.js tests/test_hatena_iframe_handler.js tests/test_gallery_navigation.js tests/test_gallery_height.js
      - name: Generate both revisions from protected published inputs without sync
        run: |
          git fetch origin gh-pages
          python tests/browser/ai_artwork_fixture.py /tmp/ai-artwork "${{ github.event.pull_request.base.sha }}"
      - name: Real WebP paint, all layers, unchanged geometry and no missing resources
        env:
          PLAYWRIGHT_MODULE_PATH: /tmp/ai-artwork-browser/node_modules/playwright
        run: node tests/browser/ai_artwork.cjs /tmp/ai-artwork
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-artwork-${{ github.event.pull_request.head.sha }}
          path: |
            /tmp/ai-artwork/*.json
            /tmp/ai-artwork/screenshots/
          retention-days: 30
