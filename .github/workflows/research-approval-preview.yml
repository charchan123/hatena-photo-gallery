name: Authorized research approval preview
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-approval-preview.yml'
      - 'audit/research-approval-2026-10-17/**'
      - 'sync-migrations/photo-deletions/**'
permissions:
  contents: read
  pull-requests: read
jobs:
  preview:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'approval/research-photos-2026-10-17'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: git fetch origin main gh-pages sync-deletion-audit
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - uses: actions/cache/restore@v4
        with:
          path: cache/exif-cache.json
          key: approved-research-preview-${{ github.run_id }}
          restore-keys: |
            exif-cache-v1-${{ runner.os }}-
      - name: Formal individual decisions and isolated real generation (no ref writes)
        env:
          HATENA_USER: ${{ secrets.HATENA_USER }}
          HATENA_BLOG_ID: ${{ secrets.HATENA_BLOG_ID }}
          HATENA_API_KEY: ${{ secrets.HATENA_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: python audit/research-approval-2026-10-17/verify.py
      - name: Save only approved public-photo capsules and sanitized evidence
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: research-approval-preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: cache/research-approval-bundle/
          if-no-files-found: error
          retention-days: 30
