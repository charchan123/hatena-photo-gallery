<script>
/* Install only after the exported current footer has been reconciled.
 * The separate header marker is the last, explicit activation step.
 */
(() => {
  'use strict';
  const marker = document.getElementById('kinoko-home-release');
  const query = new URLSearchParams(location.search);
  if (location.origin !== 'https://exsudoporus-ruber.hatenablog.jp' ||
      location.pathname !== '/' || query.has('page') || query.has('kinoko-native') ||
      !document.body.classList.contains('page-index') ||
      marker?.dataset.release !== '2026-10-24' ||
      document.getElementById('kinoko-home-portal') ||
      document.getElementById('photoGallery')) return;
  const content = document.getElementById('content');
  const container = document.getElementById('container-inner');
  if (!content || content.parentElement !== container ||
      !document.querySelector('#main-inner article.entry')) return;

  const portal = document.createElement('section');
  portal.id = 'kinoko-home-portal';
  portal.className = 'new-top-embed';
  portal.setAttribute('aria-label', 'キノコと田舎遊び・新トップ');
  const navigation = document.createElement('nav');
  navigation.className = 'kinoko-home-fallback';
  navigation.setAttribute('aria-label', '記事一覧と表示の切替');
  for (const [text, href] of [
    ['最新記事・過去の記事一覧', '/archive'],
    ['新トップを別画面で開く', 'https://charchan123.github.io/hatena-photo-gallery/new-top.html'],
    ['従来の記事表示', '/?kinoko-native=1'],
    ['RSS', '/rss'],
  ]) {
    const link = document.createElement('a');
    link.textContent = text;
    link.href = href;
    navigation.append(link);
  }
  const status = document.createElement('p');
  status.className = 'kinoko-home-status';
  status.setAttribute('role', 'status');
  status.textContent = '新トップを読み込んでいます。表示されない場合は記事一覧をご利用ください。';
  const frame = document.createElement('iframe');
  frame.id = 'photoGallery';
  frame.title = 'キノコ図鑑・Best Shot・不明キノコ研究室への入口';
  frame.src = 'https://charchan123.github.io/hatena-photo-gallery/new-top.html';
  frame.width = '100%';
  frame.height = '600';
  frame.setAttribute('allowfullscreen', '');
  frame.setAttribute('scrolling', 'no');
  // Exactly the permissions observed on the existing /new-top embed; no expansion.
  frame.setAttribute('sandbox', 'allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-popups allow-downloads allow-popups-to-escape-sandbox allow-top-navigation-by-user-activation allow-presentation allow-orientation-lock allow-modals');
  const menu = document.createElement('details');
  menu.className = 'kinoko-home-navigation';
  menu.hidden = true;
  const menuTitle = document.createElement('summary');
  menuTitle.textContent = 'MENU · 記事一覧と表示の切替';
  menu.append(menuTitle, navigation);
  let failed = false;
  frame.addEventListener('kinoko:height-ready', () => {
    if (failed || frame.getBoundingClientRect().height <= 0) return;
    status.hidden = true;
    document.body.classList.remove('kinoko-home-pending');
    document.body.classList.add('kinoko-home-active');
  });
  portal.append(status, frame, menu);
  container.insertBefore(portal, content);
  document.body.classList.add('kinoko-home-ready');
  setTimeout(() => {
    if (!status.hidden) {
      failed = true;
      menu.hidden = false;
      menu.open = true;
      frame.hidden = true;
      document.body.classList.remove('kinoko-home-pending', 'kinoko-home-ready', 'kinoko-home-active');
      status.textContent = '新トップを確認できません。記事一覧・従来表示のリンクをご利用ください。';
    }
  }, 8000);
})();

<script>
(function() {
  "use strict";
  const iframe = document.getElementById("photoGallery");
  if (!iframe || iframe.dataset.kinokoHeightBound) return;
  iframe.dataset.kinokoHeightBound = "2026-10-24";
  const galleryURL = new URL(iframe.src, location.href);
  const galleryOrigin = galleryURL.origin;
  const galleryPath = galleryURL.pathname.slice(0, galleryURL.pathname.lastIndexOf("/") + 1);
  const wrapper = iframe.closest('.new-top-embed, #galleryWrapper') || iframe.parentElement;
  const originalMinHeight = wrapper.style.minHeight;
  const originalAnchor = wrapper.style.overflowAnchor;
  const baseMinHeight = parseFloat(getComputedStyle(wrapper).minHeight) || 0;
  let lastHeight = -1, reserved = false, previousY = 0;
  let scrollTarget = null, galleryReady = false;
  let navigationPending = null;
  let previousWidth = iframe.getBoundingClientRect().width, widthResizePending = false;
  let lightboxOverlay = null;
  let photoOpeningId = null;
  const supportsOverlay = typeof wrapper.showPopover === 'function';
  function openLightboxOverlay() {
    if (!supportsOverlay || lightboxOverlay) return;
    const context = getScrollContext();
    const placeholder = document.createElement('div');
    const cs = getComputedStyle(wrapper);
    placeholder.setAttribute('aria-hidden', 'true');
    Object.assign(placeholder.style, {height:wrapper.getBoundingClientRect().height+'px', marginTop:cs.marginTop, marginBottom:cs.marginBottom});
    wrapper.before(placeholder);
    lightboxOverlay = {placeholder, context, openingWidth:iframe.getBoundingClientRect().width, wrapperStyle:wrapper.getAttribute('style'), frameStyle:iframe.getAttribute('style'), popover:wrapper.getAttribute('popover')};
    wrapper.setAttribute('popover','manual');
    wrapper.dataset.kinokoLightbox = '';
    Object.entries({position:'fixed',inset:'auto',top:context.viewportTop+'px',left:'0',width:'100vw',height:context.viewportHeight+'px',maxWidth:'none',maxHeight:'none',minHeight:'0',margin:'0',padding:'0',border:'0',overflow:'hidden'}).forEach(([key,value])=>wrapper.style.setProperty(key.replace(/[A-Z]/g,c=>'-'+c.toLowerCase()),value,'important'));
    Object.assign(iframe.style,{height:context.viewportHeight+'px',width:'100%',position:'relative',display:'block'});
    try { wrapper.showPopover(); } catch (_) { closeLightboxOverlay(); }
  }
  function closeLightboxOverlay() {
    photoOpeningId = null;
    if (!lightboxOverlay) return;
    const saved = lightboxOverlay;
    lightboxOverlay = null;
    if (wrapper.matches(':popover-open')) wrapper.hidePopover();
    for (const [node, value] of [[wrapper,saved.wrapperStyle],[iframe,saved.frameStyle]]) {
      if (value === null) node.removeAttribute('style'); else node.setAttribute('style',value);
    }
    if (saved.popover === null) wrapper.removeAttribute('popover'); else wrapper.setAttribute('popover',saved.popover);
    delete wrapper.dataset.kinokoLightbox;
    saved.placeholder.remove();
    // A rotation while the photo was open changed the underlying page layout.
    // Do not recreate a min-height reservation from the pre-rotation position.
    const width = iframe.getBoundingClientRect().width;
    if (Math.abs(width - saved.openingWidth) > .5) {
      releaseSpace();
      widthResizePending = true;
      previousWidth = width;
    }
    (saved.context.element || window).scrollTo({top:saved.context.scrollTop,behavior:'instant'});
  }

  function getScrollContext() {
    const root = document.documentElement, body = document.body;
    // Hatena Staging locks HTML and scrolls an independently sized BODY.
    // Detect the layout even at scrollTop=0 or after content becomes short.
    const bodyScrolls = body && /^(auto|scroll)$/.test(getComputedStyle(body).overflowY) &&
      body.clientHeight > 0 && body.clientHeight <= window.innerHeight &&
      (/^(hidden|clip)$/.test(getComputedStyle(root).overflowY) ||
       root.scrollHeight <= root.clientHeight + 1);
    const element = bodyScrolls ? body : null;
    const context = {
      mode: element ? 'element' : 'window', element,
      scrollTop: element ? element.scrollTop : window.scrollY,
      viewportHeight: element ? element.clientHeight : window.innerHeight,
      viewportTop: element ? element.getBoundingClientRect().top + element.clientTop : 0
    };
    const target = element || window;
    if (target !== scrollTarget) {
      scrollTarget?.removeEventListener('scroll', onScroll);
      scrollTarget = target;
      previousY = context.scrollTop;
      target.addEventListener('scroll', onScroll, { passive:true });
    }
    return context;
  }
  function contentTop(element, context) {
    return element.getBoundingClientRect().top - context.viewportTop + context.scrollTop;
  }
  function onScroll() {
    const context = getScrollContext();
    // Reclaim only during upward scrolling, without programmatically moving it.
    if (reserved && context.scrollTop < previousY) preserveViewport(lastHeight);
    previousY = context.scrollTop;
  }
  function requestHeight() {
    // Initial about:blank still belongs to Hatena; wait for load or an
    // authenticated child message before posting to the exact gallery origin.
    if (!galleryReady) return;
    // Match the host viewport contract, including classic scrollbar space.
    // The child keeps its actual width; this is a layout choice, not a resize.
    iframe.contentWindow?.postMessage({ type:"requestHeight", overlayViewport:supportsOverlay, photoOpeningProtocol:supportsOverlay ? 1 : undefined,
      portalWide:document.getElementById('kinoko-home-portal') ? window.innerWidth >= 900 : undefined }, galleryOrigin);
  }
  function releaseSpace() {
    wrapper.style.minHeight = originalMinHeight;
    wrapper.style.overflowAnchor = originalAnchor;
    reserved = false;
  }
  function preserveViewport(height) {
    const context = getScrollContext();
    const top = contentTop(wrapper, context);
    // Keep the actual iframe height accurate. Reserve space outside the iframe
    // so an in-place collapse cannot clamp the parent's scroll position.
    const floor = Math.max(baseMinHeight, Math.ceil(context.scrollTop + context.viewportHeight - top));
    if (floor > height) {
      wrapper.style.minHeight = floor + 'px';
      wrapper.style.overflowAnchor = 'none';
      reserved = true;
    } else if (reserved) releaseSpace();
  }
  function applyHeight(value) {
    if (typeof value !== 'number' || !Number.isFinite(value) || value < 0) return;
    const height = Math.ceil(value);
    if (lightboxOverlay) return;
    const skipReservation = widthResizePending;
    widthResizePending = false;
    if (height === lastHeight) return;
    if (!skipReservation) preserveViewport(height);
    lastHeight = height;
    iframe.style.height = height + 'px';
    iframe.style.opacity = '1';
    iframe.dispatchEvent(new Event("kinoko:height-ready"));
  }
  function scrollToTitle() {
    const context = getScrollContext();
    const top = Math.max(0, contentTop(iframe, context) - 20);
    (context.element || window).scrollTo({ top, behavior:'instant' });
  }
  iframe.addEventListener('load', () => {
    // Ignore the initial parent-origin document, if its load is observable.
    try {
      if (iframe.contentWindow.location.origin !== galleryOrigin) return;
    } catch (_) { /* Cross-origin gallery document: location is inaccessible. */ }
    galleryReady = true;
    closeLightboxOverlay();
    // Navigation has already scrolled before ACK; load only fits the new page.
    navigationPending = null;
    releaseSpace();
    lastHeight = -1;
    previousY = getScrollContext().scrollTop;
    requestHeight();
    [200, 800, 2000].forEach(delay => setTimeout(requestHeight, delay));
  });
  window.addEventListener('message', event => {
    if (event.source !== iframe.contentWindow || event.origin !== galleryOrigin) return;
    galleryReady = true;
    const data = event.data || {};
    if (data.type === 'navigationIntent') {
      if (typeof data.id !== 'string' || !data.id || data.id.length > 80 ||
          typeof data.destination !== 'string') return;
      let destination;
      try { destination = new URL(data.destination, galleryURL); } catch (_) { return; }
      if (destination.origin !== galleryOrigin || !destination.pathname.startsWith(galleryPath) ||
          !destination.pathname.endsWith('.html')) return;
      if (navigationPending?.id !== data.id) {
        // Settle while the long departing page still exists, before child ACK.
        scrollToTitle();
        navigationPending = { id:data.id, scrolled:true };
        previousY = getScrollContext().scrollTop;
      }
      // The child waits for this source/origin-bound ACK before replacing itself.
      iframe.contentWindow.postMessage({ type:'navigationIntentAck', id:data.id }, galleryOrigin);
    } else if (data.type === 'navigationIntentCancel') {
      if (data.id === navigationPending?.id) navigationPending = null;
    } else if (data.type === 'setHeight') {
      applyHeight(data.height);
    } else if (data.type === 'scrollToTitle') {
      // Navigation is explicit; settle immediately, independently of height updates.
      scrollToTitle();
      setTimeout(requestHeight, 200);
    } else if (data.type === 'photoOpening') {
      if (typeof data.id !== 'string' || data.id.length > 80 ||
          !/^photo-[0-9]+-[0-9]+$/.test(data.id)) return;
      // Capture the host position and establish the viewport BEFORE the child
      // calls showModal, whose focus may otherwise scroll the outer document.
      if (lightboxOverlay && photoOpeningId !== data.id) {
        iframe.contentWindow.postMessage({type:'photoOpeningAck', id:data.id, ok:false}, galleryOrigin);
        return;
      }
      if (!lightboxOverlay) openLightboxOverlay();
      const ok = !!lightboxOverlay;
      if (ok) photoOpeningId = data.id;
      iframe.contentWindow.postMessage({type:'photoOpeningAck', id:data.id, ok}, galleryOrigin);
    } else if (data.type === 'photoOpeningCancel') {
      if (photoOpeningId && data.id === photoOpeningId) {
        closeLightboxOverlay();
        requestHeight();
      }
    } else if (data.type === 'lgOpening') {
      openLightboxOverlay();
    } else if (data.type === 'lgClosed') {
      closeLightboxOverlay();
      if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
      [80, 250, 800].forEach(delay => setTimeout(requestHeight, delay));
    }
  });
  window.addEventListener('resize', () => {
    if (lightboxOverlay) {
      const c = lightboxOverlay.context;
      const height = c.element ? c.element.clientHeight : window.innerHeight;
      wrapper.style.height = height + 'px'; iframe.style.height = height + 'px';
      return;
    }
    const width = iframe.getBoundingClientRect().width;
    getScrollContext();
    if (Math.abs(width - previousWidth) > .5) {
      releaseSpace(); widthResizePending = true; previousWidth = width;
    } else if (lastHeight >= 0) preserveViewport(lastHeight);
    requestHeight();
  });
  window.addEventListener('click', event => {
    if (event.target.closest?.('#galleryWrapper a')) setTimeout(requestHeight, 100);
  });
  getScrollContext();
})();
</script>
